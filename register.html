<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — ESKENDEROV</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container header-container">
        <a href="index.html" class="logo">
            ESKENDEROV<span>.</span>
        </a>

        <a href="index.html" class="nav-login">
            На главную
        </a>
    </div>
</header>

<main class="auth-page">

    <div class="auth-box">

        <p class="section-number">ACCOUNT / 01</p>

        <h1>Создать<br><span>аккаунт.</span></h1>

        <form id="registerForm">

            <div class="form-group">
                <label for="registerName">Имя</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Ваше имя"
                    required
                >
            </div>

            <div class="form-group">
                <label for="registerEmail">Email</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="example@mail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="registerPassword">Пароль</label>
                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Минимум 6 символов"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="button button-primary auth-button">
                Зарегистрироваться
            </button>

            <p id="registerMessage" class="auth-message"></p>

        </form>

        <p class="auth-switch">
            Уже есть аккаунт?
            <a href="login.html">Войти</a>
        </p>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
