<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Личный кабинет — ESKENDEROV</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="header">

    <div class="container header-container">

        <a href="index.html" class="logo">
            ESKENDEROV<span>.</span>
        </a>

        <button
            id="logoutButton"
            class="nav-login logout-button"
        >
            Выйти
        </button>

    </div>

</header>


<main class="profile-page">

    <div class="container">

        <div class="profile-header">

            <div>

                <p class="section-number">
                    PERSONAL / ACCOUNT
                </p>

                <h1>
                    Личный<br>
                    <span>кабинет.</span>
                </h1>

            </div>


            <div class="profile-avatar" id="profileAvatar">
                E
            </div>

        </div>


        <div class="profile-grid">


            <div class="profile-card">

                <p class="profile-label">
                    ИНФОРМАЦИЯ
                </p>

                <div class="profile-row">

                    <span>Имя</span>

                    <strong id="profileName">
                        —
                    </strong>

                </div>


                <div class="profile-row">

                    <span>Email</span>

                    <strong id="profileEmail">
                        —
                    </strong>

                </div>


                <div class="profile-row">

                    <span>Статус</span>

                    <strong class="status">
                        Активен
                    </strong>

                </div>

            </div>


            <div class="profile-card">

                <p class="profile-label">
                    БЫСТРЫЕ ДЕЙСТВИЯ
                </p>

                <a
                    href="index.html#projects"
                    class="profile-action"
                >
                    Посмотреть проекты
                    <span>→</span>
                </a>

                <a
                    href="index.html#contact"
                    class="profile-action"
                >
                    Связаться со мной
                    <span>→</span>
                </a>

                <button
                    id="deleteAccount"
                    class="profile-action danger"
                >
                    Удалить аккаунт
                    <span>×</span>
                </button>

            </div>

        </div>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
