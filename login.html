<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — ESKENDEROV</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container header-container">

        <a href="index.html" class="logo">
            ESKENDEROV<span>.</span>
        </a>

        <a href="index.html" class="nav-login">
            На главную
        </a>

    </div>
</header>


<main class="auth-page">

    <div class="auth-box">

        <p class="section-number">
            ACCOUNT / 02
        </p>

        <h1>
            С возвращением<span>.</span>
        </h1>

        <form id="loginForm">

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="example@mail.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Пароль
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Введите пароль"
                    required
                >

            </div>


            <button
                type="submit"
                class="button button-primary auth-button"
            >
                Войти
            </button>

            <p
                id="loginMessage"
                class="auth-message"
            ></p>

        </form>


        <p class="auth-switch">

            Нет аккаунта?

            <a href="register.html">
                Зарегистрироваться
            </a>

        </p>

    </div>

</main>


<script src="script.js"></script>

</body>
</html>
